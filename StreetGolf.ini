; =====================================================================
;  Street Golf 1.1.0 - by spitmux - configuration
;  Lives next to StreetGolf.cs in <GTA V Enhanced>\scripts\
;  Edit, then press Insert in game to reload scripts.
; =====================================================================

[Keys]
; Keyboard. Any System.Windows.Forms.Keys name: F3, F10, NumPad1, OemTilde...
ToggleKey=F3
NewBallKey=N
; Cycles the ball mode while you are playing.
BallModeKey=M
; Turns police reactions on and off while you are playing.
PoliceKey=K

; Controller toggle: hold the first, tap the second. GTA.Control names.
; Not LB or RB, they change club, and not the d-pad, that is the settings
; list. Left trigger plus A.
PadToggleHold=FrontendLt
PadTogglePress=FrontendAccept

[Ball]
; What the ball itself is. The club, the swing and the physics are the same in
; every one of these; only what leaves the tee changes. Cycle them in game with
; the BallModeKey above.
;
;   Normal      an ordinary golf ball
;   Fire        sets light to everything it touches and leaves fires behind
;   Boom        detonates on the first thing it hits, then it is gone
;   Super       every club multiplied by SuperShotMultiplier below
BallMode=Normal

; What SUPER SHOT multiplies every club by. 50 is what it says on the tin and
; sends the ball clean over the map; the speed ceiling is lifted to match, or
; the multiplier would simply be thrown away. Try 5 or 10 for something you can
; still follow with the camera.
SuperShotMultiplier=50

[Display]
; auto = follow the game's own measurement setting (vanilla golf behaviour).
; Force with: yards | metres
Units=auto
Hud=true
; The settings drawer on the card slides open when the d-pad or the arrow keys
; are touched and shuts this many seconds after they were last used. 0 keeps
; it open all the time.
MenuAutoHide=6
; Developer diagnostics: a counter line for impact probes and the trigger
; reading, plus a StreetGolf.log beside this file. Leave it off.
Debug=false
; Ghost arc showing where the shot will land
AimLine=true

[Trail]
; The soft glowing ribbon the ball leaves behind
Trail=true
; Seconds before a piece of the trail has completely faded out
TrailSeconds=2.0
; Multiplier on a core that is already paper thin, wrapped in a soft glow.
; 1.0 is the tuned look, 0.5 is barely there, 2.0 is a thick streak.
TrailWidth=1.0
; Clear air between the ball and where the ribbon starts, in metres.
TrailGap=4.0
; Distance over which the head of the ribbon fades in behind that gap.
TrailFadeIn=6.0

[Gameplay]
; Seconds for the power meter to sweep 0 to 100 percent (it sweeps back down
; if you keep holding, so you can time it)
PowerChargeTime=1.15
; Extra aim nudge on the left stick / A and D, degrees per second
FineAimSpeed=45
; Pause after a shot before the next ball is teed up
ReloadDelay=0.55
; Knock pedestrians over when the ball hits them
PedsRagdoll=true
; Use the game's golf sound set
Sounds=true
; How many balls stay in the world at once before the oldest is removed
MaxBalls=10
; Seconds a ball survives after it is hit
BallLifetime=22
; Release inside this band of the power meter for a clean, straight shot.
; Outside it the ball hooks or slices.
SweetSpotLow=0.84
SweetSpotHigh=0.96

[AirControl]
; A little steering while the ball is out, on the left stick or WASD.
; Push left or right to bend it, up or down to lift or dip it. Full strength
; while it is flying, and about 45 percent once it is bouncing and rolling.
AirControl=true
; Sideways acceleration at full stick, metres per second squared. Up and down
; gets 60 percent of this.
AirControlPower=5.5
; Total change of velocity one shot is allowed to spend on steering, in metres
; per second. This is what keeps it a nudge rather than a remote control.
; 0 disables it, 30 lets you fly the thing.
AirControlBudget=6
; Once the ball is down to a roll it gets a separate, gentler allowance, so
; a shot that spent everything bending through the air can still be curled
; along the ground. Left and right steer it, up and down lean on its pace.
RollControlPower=3.5
RollControlBudget=5

[Impact]
; Global multiplier on everything destructive. 0 disables all damage,
; 1 is the tuned default, 2 turns the ball into a cannonball.
ImpactPower=1.0
; How hard a hit shoves the car about, separately from how much it dents it.
; The shove is kept flat and applied near the middle of the car, so it rocks
; rather than rolling over. 1 is the default; raise it carefully.
CarKnockback=0.8
; Below this speed (metres per second) the ball just bounces harmlessly,
; so a gentle putt will not dent a car.
MinImpactSpeed=9
; Chip concrete, crack render and spider glass where the ball lands.
; Uses a silent invisible bullet at the contact point to stamp the game's
; own impact damage into the surface. It is skipped whenever a pedestrian
; is within four metres, so it can never hit a bystander.
ImpactMarks=true
; Cave in body panels, knock out windows and set off alarms on cars.
CarDamage=true
; Master switch. false and the police never react to any of this, no grace
; timer, no body count, nothing. Toggle it in game with PoliceKey.
PoliceWanted=true

; A man with a golf club is a nuisance, not a gunfight. Up to the star count
; below, responding police carry a nightstick close in and a taser further
; back, so getting caught means a beating or a stun rather than being shot
; off the tee. Draw an actual firearm and it lifts at once. Their guns are
; never taken away, only holstered, so they are normal again the moment it
; stops applying.
LessLethalCops=true
LessLethalMaxStars=2
LessLethalRange=90

; Seconds at the start of each session during which the police ignore you, so
; you can tee off into traffic without the city turning up. Stars you already
; had when you started are left untouched. 0 switches the whole thing off.
PoliceGrace=180
; After the grace runs out, keep the police out of it for as long as nobody
; actually has eyes on you. Every living person within WitnessRange metres is
; checked for a clear line of sight to the golfer, and one witness is enough.
StealthWhenUnseen=true
WitnessRange=60
; Even once the grace is over and someone can see you, nobody calls in a man
; hitting golf balls. It takes this many pedestrians knocked down inside
; HeatWindow seconds before the police take an interest. Hits older than the
; window are forgotten, so an occasional casualty never builds up.
HeatAfterPeds=3
HeatWindow=45
; Controller rumble and camera jolt on impacts.
Rumble=true
CameraShake=true

[Clubs]
; Ball speed at full power (metres per second) and launch angle (degrees).
; Twelve clubs in three sets. The four standard ones; then a flatter set
; that fires lower and carries slightly further, so it runs out along a
; street or under an overpass instead of arcing over it; then a third set
; back at the standard angles but swung far harder.
DriverSpeed=72
DriverLoft=13
IronSpeed=54
IronLoft=24
WedgeSpeed=38
WedgeLoft=44
PutterSpeed=14
PutterLoft=1.5

Driver2Speed=93
Driver2Loft=8
Iron2Speed=66
Iron2Loft=16
Wedge2Speed=43
Wedge2Loft=30
PowerPutterSpeed=24
PowerPutterLoft=1

; Third set: the standard launch angles again, swung far harder.
Driver3Speed=88
Driver3Loft=13
Iron3Speed=66
Iron3Loft=24
Wedge3Speed=48
Wedge3Loft=44
Putter3Speed=34
Putter3Loft=1.5

[Stance]
; Fallback tee position relative to the golfer, in metres, used until the
; script has measured where the club head actually is.
BallForward=0.58
BallSide=0.06
